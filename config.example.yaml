# ---------------------------------------------------------------------------
# Daily email report (optional)
# ---------------------------------------------------------------------------
# `trae-dashboard report` reads this section. SMTP password is read from
# the environment variable named by `smtp_password_env` (default
# SMTP_PASSWORD) — set it in .env, never in this file (which goes to git).
#
# `send_time` is informational only — actual scheduling is controlled by
# Windows Task Scheduler / cron. See README "邮件报告部署".
# ---------------------------------------------------------------------------
email:
  enabled: false
  smtp_host: smtp.qq.com
  smtp_port: 465
  smtp_user: your_email@qq.com
  smtp_password_env: SMTP_PASSWORD
  from_addr: your_email@qq.com
  recipients:
    - recipient1@example.com
    - recipient2@example.com
  send_time: "09:00"
