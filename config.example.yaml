# Trae Enterprise OpenAPI configuration
# Copy this to config.yaml and fill in your details

# Base URL of the OpenAPI (ask your admin if unsure)
openapi_base: https://openapi.enterprise.trae.cn

# Authentication endpoint (relative to openapi_base)
auth_endpoint: /openapi/v1/auth/access_token

# Environment variable names for credentials
app_id_env: TRAE_APP_ID
app_secret_env: TRAE_APP_SECRET

# Local SQLite database path
db_path: data/dashboard.db

# How often (minutes) to fetch fresh data
fetch_interval_minutes: 60

# Per-account monthly quota in CNY (120 yuan default).
# Company total = per_account_quota * number of accounts.
# Only Trae built-in models (model_source == "Trae") are counted.
per_account_quota: 120.0

# Account list (up to 20)
