services:
  trae-dashboard:
    build: .
    image: trae-dashboard:latest
    container_name: trae-dashboard
    ports:
      - "127.0.0.1:8888:8765"      # 仅本机可访问 → http://127.0.0.1:8888
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
      - trae-dashboard-data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trae-dashboard-data:
